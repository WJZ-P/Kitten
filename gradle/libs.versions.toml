[versions]
agp = "9.4.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
coroutines = "1.11.0"
libadb = "3.1.1"
sunSecurity = "1.1"
conscrypt = "2.5.3"
# OkHttp 4.x 是久经考验的稳定线，且和 Kotlin 版本无耦合，不会因为编译器升级而失配。
okhttp = "4.12.0"
# 液体玻璃效果（Kotlin Multiplatform 库，Gradle 会自动解析到 backdrop-android）。
backdrop = "2.0.1"
# Capsule 等连续圆角形状。backdrop 自己就依赖它，这里版本要跟 backdrop 拉的那份对齐。
shapes = "1.2.1"
# 模型回复的 Markdown 渲染（mikepenz/multiplatform-markdown-renderer，Apache 2.0）。KMP 库，Gradle 会解析到
# -android；它依赖的 compose-foundation 1.12.1 和 Kotlin 2.4.21 都和我们现在用的一致。
markdownRenderer = "0.46.0"
# 代码块的语法高亮（SnipMeDev/Highlights，Apache 2.0）。和 markdown 库的 -code 模块用的是同一个版本。
highlights = "1.1.0"
# 公式（LaTeX）排版（huarangmeng/latex，MIT）。不带后缀的是按 Kotlin 2.3 / Compose Multiplatform 1.10 编译的
# 那一版（-kt2.1.0 后缀的是给老 Kotlin 用的）。几个模块的版本要一致。
latex = "1.6.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# 只要 core（发送、菜单这类基础图标）。extended 有几千个矢量图，会显著撑大包体。
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
libadb-android = { group = "com.github.MuntashirAkon", name = "libadb-android", version.ref = "libadb" }
sun-security-android = { group = "com.github.MuntashirAkon", name = "sun-security-android", version.ref = "sunSecurity" }
conscrypt-android = { group = "org.conscrypt", name = "conscrypt-android", version.ref = "conscrypt" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "backdrop" }
shapes = { group = "io.github.kyant0", name = "shapes", version.ref = "shapes" }
markdown-renderer = { group = "com.mikepenz", name = "multiplatform-markdown-renderer", version.ref = "markdownRenderer" }
markdown-renderer-m3 = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
# 它只发布了 JVM 版（没有单独的 Android 版），直接引 -jvm 的那份。
highlights = { group = "dev.snipme", name = "highlights-jvm", version.ref = "highlights" }
latex-renderer = { group = "io.github.huarangmeng", name = "latex-renderer", version.ref = "latex" }
latex-fonts-katex = { group = "io.github.huarangmeng", name = "latex-fonts-katex", version.ref = "latex" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
